<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controller - Bảng Điều Khiển Chuông</title>
    <style>
      :root {
        --bg-main: #0f172a;
        --bg-card: #1e293b;
        --blue: blue;
        --aqua: aqua;
        --yellow: yellow;
        --green: green;
        --red: red;
        --pink: #ff00cc;
        --purple: purple;
        --lime: #39ff14;
        --orange: orange;
        --black: #000000;
        --white: #ffffff;
        --light-blue: aqua;
        --dark-blue: blue;
      }

      * {
        font-weight: bold !important;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      body {
        background-color: var(--bg-main);
        color: var(--white);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 24px 16px;
        scale: 0.75;
      }

      button {
        cursor: pointer;
        border: 2px solid var(--white);
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 16px;
        transition: all 0.15s ease-in-out;
        outline: none;
      }

      button:hover:not(:disabled) {
        background-color: var(--orange) !important;
        color: var(--black) !important;
        border-color: var(--orange) !important;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .app-header {
        width: 100%;
        max-width: 750px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 3px solid var(--aqua);
        padding-bottom: 12px;
        margin-bottom: 20px;
      }

      .header-title {
        font-size: 24px;
        color: var(--yellow);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .header-badge {
        background-color: var(--purple);
        color: var(--white);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 14px;
      }

      .card-container {
        width: 100%;
        max-width: 750px;
        background-color: var(--bg-card);
        border: 3px solid var(--aqua);
        border-radius: 12px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      }

      .form-input {
        width: 100%;
        padding: 12px 16px;
        font-size: 18px;
        background-color: var(--bg-main);
        color: var(--white);
        border: 2px solid var(--aqua);
        border-radius: 8px;
        outline: none;
      }

      .form-input:focus {
        border-color: var(--yellow);
      }

      .btn-primary {
        background-color: var(--yellow);
        color: var(--black);
        border-color: var(--yellow);
        font-size: 18px;
        padding: 14px 20px;
        width: 100%;
      }

      .room-info-box {
        background-color: var(--bg-main);
        border: 2px solid var(--yellow);
        border-radius: 8px;
        padding: 18px;
        margin-top: 12px;
      }

      .passwords-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 14px;
      }

      .player-auth-card {
        background-color: var(--bg-card);
        border: 2px solid var(--aqua);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }

      .player-auth-card.p1 {
        background-color: #ffffff;
        border-color: var(--red);
        color: #000000;
      }

      .player-auth-card.p2 {
        background-color: var(--bg-card);
        border-color: var(--yellow);
        color: var(--white);
      }

      .player-auth-card.p3 {
        background-color: #ffffff;
        border-color: var(--blue);
        color: #000000;
      }

      .controls-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 16px;
      }

      .btn-open {
        background-color: var(--green);
        color: var(--white);
        border-color: var(--green);
      }

      .btn-lock {
        background-color: var(--red);
        color: var(--white);
        border-color: var(--red);
      }

      .btn-reset-open {
        background-color: var(--blue);
        color: var(--white);
        border-color: var(--blue);
      }

      .btn-reset-lock {
        background-color: var(--purple);
        color: var(--white);
        border-color: var(--purple);
      }

      .status-indicator {
        font-size: 20px;
        text-align: center;
        padding: 14px;
        border-radius: 8px;
        margin-top: 16px;
        border: 2px solid var(--white);
      }

      .status-locked {
        background-color: var(--bg-main);
        color: var(--white);
        border-color: var(--red);
      }

      .status-open {
        background-color: var(--green);
        color: var(--white);
        border-color: var(--lime);
      }

      .status-buzzed {
        background-color: #00ffff !important;
        color: #000000 !important;
        border-color: #00ffff !important;
      }

      .direct-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
        justify-content: center;
      }

      .nav-link {
        color: var(--aqua);
        text-decoration: none;
        border: 1px solid var(--aqua);
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 14px;
        background-color: var(--bg-main);
      }

      .nav-link:hover {
        background-color: var(--orange) !important;
        color: var(--black) !important;
        border-color: var(--orange) !important;
      }

      /* TOAST NOTIFICATION */
      #toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }

      .toast-msg {
        background-color: var(--bg-card);
        color: var(--white);
        border: 2px solid var(--aqua);
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 15px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
        animation: toastIn 0.25s ease-out;
        pointer-events: auto;
      }

      .toast-msg.success {
        border-color: var(--green);
        color: var(--lime);
      }

      .toast-msg.error {
        border-color: var(--red);
        color: var(--red);
      }

      .toast-msg.info {
        border-color: var(--aqua);
        color: var(--aqua);
      }

      @keyframes toastIn {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* POPUP MODAL */
      #popup-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(15, 23, 42, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        padding: 16px;
      }

      .popup-card {
        background-color: var(--bg-card);
        border: 3px solid var(--yellow);
        border-radius: 12px;
        padding: 24px;
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      }

      .popup-title {
        font-size: 22px;
        color: var(--yellow);
      }

      .popup-body {
        font-size: 16px;
        color: var(--white);
        line-height: 1.5;
        white-space: pre-line;
      }

      .popup-close-btn {
        background-color: var(--yellow);
        color: var(--black);
        border-color: var(--yellow);
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1 class="header-title">BẢNG ĐIỀU KHIỂN - CONTROLLER</h1>
      <span class="header-badge" id="connection-status">Chưa vào phòng</span>
    </header>

    <main class="card-container">
      <button id="btn-create-room" class="btn-primary">
        Tạo mã phòng và mật khẩu
      </button>

      <div style="display: flex; gap: 8px; margin-top: 4px;">
        <input
          type="text"
          id="input-existing-room"
          class="form-input"
          placeholder="Hoặc nhập mã phòng 6 số đã có..."
          maxlength="6"
        />
        <button id="btn-load-room" style="background-color: var(--aqua); color: var(--black); white-space: nowrap; border-color: var(--aqua);">
          Tải phòng
        </button>
      </div>

      <div id="room-details-section" style="display: none;">
        <div class="room-info-box">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <span style="color: var(--aqua); font-size: 14px;">MÃ PHÒNG:</span>
              <h2 id="display-room-id" style="font-size: 32px; color: var(--yellow); letter-spacing: 2px;">
                ------
              </h2>
            </div>
            <button id="btn-copy-room" style="background-color: var(--bg-card); color: var(--aqua); border-color: var(--aqua); font-size: 13px; padding: 8px 14px;">
              Sao chép mã
            </button>
          </div>

          <div class="passwords-grid">
            <div class="player-auth-card p1">
              <div style="color: #dc2626; font-size: 13px;">PLAYER 1</div>
              <div id="display-p1-pass" style="font-size: 20px; color: #000000; margin: 4px 0;">----</div>
              <div style="font-size: 11px; color: #475569;">Mật khẩu P1</div>
            </div>
            <div class="player-auth-card p2">
              <div style="color: var(--yellow); font-size: 13px;">PLAYER 2</div>
              <div id="display-p2-pass" style="font-size: 20px; color: var(--white); margin: 4px 0;">----</div>
              <div style="font-size: 11px; color: var(--aqua);">Mật khẩu P2</div>
            </div>
            <div class="player-auth-card p3">
              <div style="color: #2563eb; font-size: 13px;">PLAYER 3</div>
              <div id="display-p3-pass" style="font-size: 20px; color: #000000; margin: 4px 0;">----</div>
              <div style="font-size: 11px; color: #475569;">Mật khẩu P3</div>
            </div>
          </div>
        </div>

        <div id="bell-status-banner" class="status-indicator status-locked">
          Trạng thái chuông: KHÓA
        </div>

        <div class="controls-grid">
          <button id="btn-open-bell" class="btn-open">
            Mở chuông
          </button>
          <button id="btn-lock-bell" class="btn-lock">
            Khóa chuông
          </button>
          <button id="btn-reset-open" class="btn-reset-open">
            Reset và Mở
          </button>
          <button id="btn-reset-lock" class="btn-reset-lock">
            Reset và Khóa
          </button>
        </div>

        <div style="margin-top: 16px; border-top: 1px solid var(--purple); padding-top: 12px;">
          <div style="color: var(--aqua); font-size: 14px; margin-bottom: 8px; text-align: center;">
            Mở nhanh các màn hình theo mã phòng:
          </div>
          <div class="direct-links">
            <a id="link-open-host" class="nav-link" href="#" target="_blank">Màn hình Host</a>
            <a id="link-open-p1" class="nav-link" href="#" target="_blank">Player 1</a>
            <a id="link-open-p2" class="nav-link" href="#" target="_blank">Player 2</a>
            <a id="link-open-p3" class="nav-link" href="#" target="_blank">Player 3</a>
          </div>
        </div>
      </div>
    </main>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <!-- POPUP MODAL -->
    <div id="popup-modal">
      <div class="popup-card">
        <h3 id="popup-title" class="popup-title">THÔNG BÁO</h3>
        <p id="popup-body" class="popup-body"></p>
        <button id="popup-close-btn" class="popup-close-btn">Đóng</button>
      </div>
    </div>

    <script>
      // Disable DevTools Protection
      function disableDevTools() {
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          return false;
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          if (
            (e.ctrlKey || e.metaKey) &&
            e.shiftKey &&
            ['I', 'i', 'J', 'j', 'C', 'c', 'K', 'k', 'M', 'm'].includes(e.key)
          ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          if (
            (e.ctrlKey || e.metaKey) &&
            ['u', 'U', 's', 'S', 'p', 'P'].includes(e.key)
          ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);

        try {
          setInterval(function () {
            console.clear();
          }, 2000);
        } catch (err) {}
      }
      disableDevTools();
    </script>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      const SUPABASE_URL = 'https://gyyjabuewruokczpqekz.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5eWphYnVld3J1b2tjenBxZWt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzOTk5NTksImV4cCI6MjA3OTk3NTk1OX0.bCsceRhW02FySQOdk61XnMLahTWtxCZIcpvvSIUNuIU';

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Toast & Popup Utilities (Strictly no alert, prompt, confirm)
      window.showToast = function(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast-msg ${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease-out';
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      };

      window.showPopup = function(title, message, type = 'info') {
        const modal = document.getElementById('popup-modal');
        const titleEl = document.getElementById('popup-title');
        const bodyEl = document.getElementById('popup-body');
        titleEl.textContent = title;
        bodyEl.textContent = message;
        modal.style.display = 'flex';
      };

      document.getElementById('popup-close-btn').addEventListener('click', () => {
        document.getElementById('popup-modal').style.display = 'none';
      });

      function playBuzzerSound() {
        try {
          const audio = new Audio('buzzer.mp3');
          audio.play().catch(() => {});
        } catch (err) {}
      }

      let currentRoomId = null;
      let currentRoomData = null;
      let realtimeChannel = null;

      const btnCreateRoom = document.getElementById('btn-create-room');
      const inputExistingRoom = document.getElementById('input-existing-room');
      const btnLoadRoom = document.getElementById('btn-load-room');
      const roomDetailsSection = document.getElementById('room-details-section');
      const displayRoomId = document.getElementById('display-room-id');
      const displayP1Pass = document.getElementById('display-p1-pass');
      const displayP2Pass = document.getElementById('display-p2-pass');
      const displayP3Pass = document.getElementById('display-p3-pass');
      const btnCopyRoom = document.getElementById('btn-copy-room');
      const bellStatusBanner = document.getElementById('bell-status-banner');
      const connectionStatus = document.getElementById('connection-status');

      const btnOpenBell = document.getElementById('btn-open-bell');
      const btnLockBell = document.getElementById('btn-lock-bell');
      const btnResetOpen = document.getElementById('btn-reset-open');
      const btnResetLock = document.getElementById('btn-reset-lock');

      const linkOpenHost = document.getElementById('link-open-host');
      const linkOpenP1 = document.getElementById('link-open-p1');
      const linkOpenP2 = document.getElementById('link-open-p2');
      const linkOpenP3 = document.getElementById('link-open-p3');

      function generate6DigitCode() {
        return Math.floor(100000 + Math.random() * 900000).toString();
      }

      function generate4DigitPass() {
        return Math.floor(1000 + Math.random() * 9000).toString();
      }

      function updateUI() {
        if (!currentRoomData) return;

        displayRoomId.textContent = currentRoomId;
        const passwords = currentRoomData.passwords || {};
        displayP1Pass.textContent = passwords['1'] || '----';
        displayP2Pass.textContent = passwords['2'] || '----';
        displayP3Pass.textContent = passwords['3'] || '----';

        const bellStatus = currentRoomData.bell_status || 'locked';
        const buzzedPlayer = currentRoomData.buzzed_player;

        if (buzzedPlayer) {
          bellStatusBanner.className = 'status-indicator status-buzzed';
          const pNames = { 1: 'PLAYER 1 (ĐỎ)', 2: 'PLAYER 2 (VÀNG)', 3: 'PLAYER 3 (XANH DƯƠNG)' };
          bellStatusBanner.textContent = `${pNames[buzzedPlayer] || 'PLAYER ' + buzzedPlayer} ĐÃ NHẤN CHUÔNG THÀNH CÔNG!`;
        } else if (bellStatus === 'open') {
          bellStatusBanner.className = 'status-indicator status-open';
          bellStatusBanner.textContent = 'TRẠNG THÁI CHUÔNG: ĐANG MỞ (SẴN SÀNG BẤM)';
        } else {
          bellStatusBanner.className = 'status-indicator status-locked';
          bellStatusBanner.textContent = 'TRẠNG THÁI CHUÔNG: ĐANG KHÓA';
        }

        linkOpenHost.href = `/Host.html?roomid=${currentRoomId}`;
        linkOpenP1.href = `/Player1.html?roomid=${currentRoomId}&auth=${passwords['1'] || ''}`;
        linkOpenP2.href = `/Player2.html?roomid=${currentRoomId}&auth=${passwords['2'] || ''}`;
        linkOpenP3.href = `/Player3.html?roomid=${currentRoomId}&auth=${passwords['3'] || ''}`;
      }

      async function subscribeToRoom(roomId) {
        if (realtimeChannel) {
          await supabase.removeChannel(realtimeChannel);
        }

        connectionStatus.textContent = `Đã kết nối phòng ${roomId}`;
        connectionStatus.style.backgroundColor = 'var(--green)';

        realtimeChannel = supabase
          .channel(`room_${roomId}`)
          .on('broadcast', { event: 'state_change' }, (payload) => {
            if (payload.payload && payload.payload.room_data) {
              const prevBuzzed = currentRoomData ? currentRoomData.buzzed_player : null;
              currentRoomData = payload.payload.room_data;
              updateUI();
              if (currentRoomData.buzzed_player && currentRoomData.buzzed_player !== prevBuzzed) {
                playBuzzerSound();
                showToast(`Player ${currentRoomData.buzzed_player} đã nhấn chuông!`, 'success');
              }
            }
          })
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` },
            (payload) => {
              if (payload.new && payload.new.room_data) {
                currentRoomData = payload.new.room_data;
                updateUI();
              }
            }
          )
          .subscribe();
      }

      async function updateRoomState(newRoomData) {
        currentRoomData = newRoomData;
        updateUI();

        if (realtimeChannel) {
          realtimeChannel.send({
            type: 'broadcast',
            event: 'state_change',
            payload: { room_data: newRoomData, updated_at: new Date().toISOString() },
          });
        }

        try {
          await supabase.from('rooms').upsert({
            id: currentRoomId,
            room_data: newRoomData,
            updated_at: new Date().toISOString(),
          });
        } catch (err) {
          console.error('Database sync error:', err);
        }
      }

      btnCreateRoom.addEventListener('click', async () => {
        btnCreateRoom.disabled = true;
        btnCreateRoom.textContent = 'Đang tạo phòng...';

        const newRoomId = generate6DigitCode();
        const p1 = generate4DigitPass();
        const p2 = generate4DigitPass();
        const p3 = generate4DigitPass();

        const newRoomData = {
          passwords: {
            '1': p1,
            '2': p2,
            '3': p3,
          },
          bell_status: 'locked',
          buzzed_player: null,
          buzzed_at: null,
          created_at: new Date().toISOString(),
        };

        try {
          const { error } = await supabase.from('rooms').upsert({
            id: newRoomId,
            room_data: newRoomData,
            updated_at: new Date().toISOString(),
          });

          if (error) throw error;

          currentRoomId = newRoomId;
          currentRoomData = newRoomData;
          roomDetailsSection.style.display = 'block';
          updateUI();
          subscribeToRoom(newRoomId);
          showToast(`Tạo phòng ${newRoomId} thành công!`, 'success');
          showPopup('ĐÃ TẠO PHÒNG MỚI', `Mã phòng: ${newRoomId}\nMật khẩu P1: ${p1}\nMật khẩu P2: ${p2}\nMật khẩu P3: ${p3}`);

          const url = new URL(window.location);
          url.searchParams.set('roomid', newRoomId);
          window.history.pushState({}, '', url);
        } catch (err) {
          console.error(err);
          showToast('Lỗi khi tạo phòng: ' + err.message, 'error');
        } finally {
          btnCreateRoom.disabled = false;
          btnCreateRoom.textContent = 'Tạo mã phòng và mật khẩu';
        }
      });

      async function loadRoom(roomId) {
        if (!roomId || roomId.trim().length !== 6) {
          showToast('Mã phòng phải gồm 6 chữ số!', 'error');
          return;
        }

        connectionStatus.textContent = 'Đang tải phòng...';
        try {
          const { data, error } = await supabase
            .from('rooms')
            .select('*')
            .eq('id', roomId.trim())
            .maybeSingle();

          if (error) throw error;

          if (!data) {
            showToast(`Không tìm thấy phòng có mã ${roomId}!`, 'error');
            connectionStatus.textContent = 'Không tìm thấy phòng';
            return;
          }

          currentRoomId = data.id;
          currentRoomData = data.room_data;
          roomDetailsSection.style.display = 'block';
          updateUI();
          subscribeToRoom(data.id);
          showToast(`Đã tải phòng ${roomId}!`, 'success');
        } catch (err) {
          console.error(err);
          showToast('Lỗi tải phòng: ' + err.message, 'error');
        }
      }

      btnLoadRoom.addEventListener('click', () => {
        loadRoom(inputExistingRoom.value);
      });

      btnCopyRoom.addEventListener('click', () => {
        if (currentRoomId) {
          navigator.clipboard.writeText(currentRoomId);
          showToast(`Đã sao chép mã phòng: ${currentRoomId}`, 'success');
          btnCopyRoom.textContent = 'Đã chép';
          setTimeout(() => {
            btnCopyRoom.textContent = 'Sao chép mã';
          }, 2000);
        }
      });

      btnOpenBell.addEventListener('click', () => {
        if (!currentRoomData) return;
        updateRoomState({ ...currentRoomData, bell_status: 'open' });
        showToast('Đã mở chuông cho tất cả người chơi!', 'info');
      });

      btnLockBell.addEventListener('click', () => {
        if (!currentRoomData) return;
        updateRoomState({ ...currentRoomData, bell_status: 'locked' });
        showToast('Đã khóa chuông!', 'info');
      });

      btnResetOpen.addEventListener('click', () => {
        if (!currentRoomData) return;
        updateRoomState({
          ...currentRoomData,
          buzzed_player: null,
          buzzed_at: null,
          bell_status: 'open',
        });
        showToast('Đã reset và mở chuông mới!', 'info');
      });

      btnResetLock.addEventListener('click', () => {
        if (!currentRoomData) return;
        updateRoomState({
          ...currentRoomData,
          buzzed_player: null,
          buzzed_at: null,
          bell_status: 'locked',
        });
        showToast('Đã reset và khóa chuông!', 'info');
      });

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('roomid');
      if (roomParam) {
        inputExistingRoom.value = roomParam;
        loadRoom(roomParam);
      }
    </script>
  </body>
</html>
